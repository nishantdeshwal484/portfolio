
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Signal Hunt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0e1a1c;
    --panel:#132427;
    --panel-glass:rgba(19,36,39,0.72);
    --edge:rgba(159,179,174,0.16);
    --edge-strong:rgba(159,179,174,0.32);
    --text-primary:#eef5f2;
    --text-muted:#93ada7;
    --text-faint:#5f7a75;
    --cold:#3fc1d6;
    --cold-dim:rgba(63,193,214,0.14);
    --hot:#f2a341;
    --hot-dim:rgba(242,163,65,0.14);
    --lock:#4fd6a0;
    --lock-dim:rgba(79,214,160,0.14);
    --danger:#e2685c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 50% -10%, rgba(63,193,214,0.08), transparent 55%),
      radial-gradient(ellipse at 100% 100%, rgba(242,163,65,0.06), transparent 50%),
      var(--bg-deep);
    color:var(--text-primary);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
  }
  .app{
    max-width:620px;
    margin:0 auto;
    padding:44px 24px 70px;
  }

  @keyframes riseIn{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes popIn{ from{opacity:0; transform:scale(0.85);} to{opacity:1; transform:scale(1);} }
  @keyframes shake{
    10%,90%{ transform:translateX(-1px); }
    20%,80%{ transform:translateX(2px); }
    30%,50%,70%{ transform:translateX(-4px); }
    40%,60%{ transform:translateX(4px); }
  }
  @keyframes pinSlide{ from{ left:var(--pin-from,0%); } to{ left:var(--pin-to,0%); } }
  @keyframes sonarPing{
    from{ transform:scale(0.4); opacity:0.9; }
    to{ transform:scale(2.6); opacity:0; }
  }
  @keyframes needleGlow{
    0%,100%{ opacity:0.55; } 50%{ opacity:1; }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }

  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:1px solid var(--edge);
    padding-bottom:18px;
    margin-bottom:26px;
    animation:riseIn .55s cubic-bezier(.2,.8,.2,1) both;
  }
  header h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:30px;
    letter-spacing:-0.01em;
    margin:0 0 6px;
  }
  header p{
    margin:0;
    font-size:13px;
    color:var(--text-muted);
    max-width:32em;
  }
  .stats{
    display:flex;
    gap:22px;
    text-align:right;
  }
  .stat{ display:flex; flex-direction:column; gap:2px; }
  .stat .num{
    font-family:'JetBrains Mono', monospace;
    font-size:22px;
    font-weight:600;
    color:var(--text-primary);
    line-height:1;
  }
  .stat .lbl{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text-faint);
  }

  .panel{
    background:var(--panel-glass);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    border:1px solid var(--edge);
    border-radius:14px;
    padding:26px 26px 24px;
    animation:riseIn .6s cubic-bezier(.2,.8,.2,1) .08s both;
  }

  .guess-row{ display:flex; gap:10px; }
  .guess-row input[type=number]{
    flex:1;
    font-family:'JetBrains Mono', monospace;
    font-size:20px;
    font-weight:500;
    color:var(--text-primary);
    background:rgba(14,26,28,0.55);
    border:1px solid var(--edge-strong);
    border-radius:8px;
    padding:12px 14px;
    outline:none;
    transition:border-color .18s ease, box-shadow .18s ease;
  }
  .guess-row input[type=number]::-webkit-outer-spin-button,
  .guess-row input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .guess-row input[type=number]::placeholder{ color:var(--text-faint); font-weight:400; }
  .guess-row input[type=number]:focus{
    border-color:var(--cold);
    box-shadow:0 0 0 4px var(--cold-dim);
  }
  .guess-row input.shake{ animation:shake .4s ease; border-color:var(--danger); }

  .fire-btn{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:0.02em;
    color:var(--bg-deep);
    background:var(--text-primary);
    border:none;
    border-radius:8px;
    padding:0 22px;
    cursor:pointer;
    transition:background-color .18s ease, transform .15s ease, box-shadow .18s ease;
  }
  .fire-btn:hover{ background:var(--cold); box-shadow:0 6px 16px rgba(63,193,214,0.25); transform:translateY(-1px); }
  .fire-btn:active{ transform:translateY(0) scale(0.97); }

  .input-note{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--danger);
    min-height:16px;
    margin-top:8px;
    opacity:0;
    transition:opacity .18s ease;
  }
  .input-note.show{ opacity:1; }

  .readout{
    margin-top:22px;
    padding-top:20px;
    border-top:1px solid var(--edge);
  }
  .readout .hint-line{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:19px;
    min-height:26px;
  }
  .hint-line .arrow{ font-size:18px; line-height:1; }
  .hint-line.dir-up{ color:var(--hot); }
  .hint-line.dir-down{ color:var(--cold); }
  .hint-line.dir-idle{ color:var(--text-faint); font-weight:400; font-size:15px; }
  .hint-sub{
    font-size:12px;
    color:var(--text-muted);
    margin-top:4px;
    font-family:'JetBrains Mono', monospace;
  }

  .meter{
    position:relative;
    margin-top:18px;
    height:10px;
    border-radius:999px;
    background:linear-gradient(90deg, var(--cold) 0%, rgba(147,173,167,0.35) 50%, var(--hot) 100%);
    opacity:0.85;
  }
  .meter .pin{
    position:absolute;
    top:50%;
    left:0%;
    width:16px;
    height:16px;
    margin-left:-8px;
    margin-top:-8px;
    border-radius:50%;
    background:var(--text-primary);
    border:3px solid var(--bg-deep);
    box-shadow:0 0 0 2px var(--edge-strong);
    transition:left .45s cubic-bezier(.2,.8,.2,1);
  }
  .meter-labels{
    display:flex;
    justify-content:space-between;
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin-top:8px;
  }

  .history-label{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin:24px 0 10px;
  }
  .history{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    min-height:20px;
  }
  .chip{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    font-weight:500;
    padding:5px 10px;
    border-radius:999px;
    border:1px solid var(--edge-strong);
    color:var(--text-muted);
    display:flex;
    align-items:center;
    gap:5px;
    animation:popIn .3s cubic-bezier(.2,.8,.2,1) both;
  }
  .chip.up{ border-color:rgba(242,163,65,0.4); color:var(--hot); background:var(--hot-dim); }
  .chip.down{ border-color:rgba(63,193,214,0.4); color:var(--cold); background:var(--cold-dim); }
  .chip.hit{ border-color:rgba(79,214,160,0.5); color:var(--lock); background:var(--lock-dim); }
  .empty-history{
    font-size:12px;
    color:var(--text-faint);
    font-style:italic;
  }

  /* ---- Win overlay ---- */
  .win-wrap{
    position:relative;
    margin-top:22px;
    padding-top:22px;
    border-top:1px solid var(--edge);
    text-align:center;
    animation:riseIn .5s cubic-bezier(.2,.8,.2,1) both;
  }
  .sonar-stage{
    position:relative;
    width:100%;
    height:96px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:6px;
  }
  .sonar-ring{
    position:absolute;
    width:60px;
    height:60px;
    border-radius:50%;
    border:2px solid var(--lock);
    animation:sonarPing 1.6s ease-out infinite;
  }
  .sonar-ring.r2{ animation-delay:.4s; }
  .sonar-ring.r3{ animation-delay:.8s; }
  .sonar-core{
    position:relative;
    width:52px;
    height:52px;
    border-radius:50%;
    background:var(--lock-dim);
    border:1px solid var(--lock);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:22px;
    color:var(--lock);
  }
  .win-wrap h2{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:24px;
    margin:6px 0 6px;
    color:var(--text-primary);
  }
  .win-wrap p{
    font-size:14px;
    color:var(--text-muted);
    margin:0 0 6px;
  }
  .best-badge{
    display:inline-block;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.05em;
    color:var(--lock);
    background:var(--lock-dim);
    border:1px solid rgba(79,214,160,0.4);
    border-radius:999px;
    padding:4px 12px;
    margin-top:6px;
  }
  .again-btn{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:14px;
    color:var(--bg-deep);
    background:var(--lock);
    border:none;
    border-radius:8px;
    padding:12px 22px;
    cursor:pointer;
    margin-top:18px;
    transition:transform .15s ease, box-shadow .18s ease, filter .18s ease;
  }
  .again-btn:hover{ filter:brightness(1.08); box-shadow:0 8px 20px rgba(79,214,160,0.22); transform:translateY(-1px); }
  .again-btn:active{ transform:translateY(0) scale(0.97); }

  .footnote{
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    color:var(--text-faint);
    margin-top:34px;
    letter-spacing:0.04em;
  }

  ::selection{ background:var(--cold-dim); }
</style>
</head>
<body>

<div class="app">

  <header>
    <div>
      <h1>Signal Hunt</h1>
      <p>A frequency between 1 and 100 is hidden in the static. Guess a number to tune toward it.</p>
    </div>
    <div class="stats">
      <div class="stat">
        <span class="num" id="guessCount">0</span>
        <span class="lbl">Guesses</span>
      </div>
      <div class="stat">
        <span class="num" id="bestCount">–</span>
        <span class="lbl">Best</span>
      </div>
    </div>
  </header>

  <div class="panel">

    <div id="playArea">
      <div class="guess-row">
        <input type="number" id="guessInput" placeholder="Enter a number, 1–100" min="1" max="100" autocomplete="off" />
        <button class="fire-btn" id="guessBtn">Tune</button>
      </div>
      <div class="input-note" id="inputNote"></div>

      <div class="readout">
        <div class="hint-line dir-idle" id="hintLine">No guesses yet — take your first shot.</div>
        <div class="hint-sub" id="hintSub">&nbsp;</div>
        <div class="meter">
          <div class="pin" id="meterPin"></div>
        </div>
        <div class="meter-labels"><span>Ice cold</span><span>Blazing hot</span></div>
      </div>

      <div class="history-label">History</div>
      <div class="history" id="historyList">
        <span class="empty-history">Your guesses will appear here.</span>
      </div>
    </div>

    <div id="winArea" style="display:none;"></div>

  </div>

  <div class="footnote" id="statusLine">signal receiver ready</div>
</div>

<script>
(function(){
  var STORAGE_KEY = 'signal_hunt_best';

  var target = 0;
  var guesses = 0;
  var history = [];
  var won = false;
  var best = null;

  var guessInput = document.getElementById('guessInput');
  var guessBtn = document.getElementById('guessBtn');
  var inputNote = document.getElementById('inputNote');
  var guessCountEl = document.getElementById('guessCount');
  var bestCountEl = document.getElementById('bestCount');
  var hintLine = document.getElementById('hintLine');
  var hintSub = document.getElementById('hintSub');
  var meterPin = document.getElementById('meterPin');
  var historyList = document.getElementById('historyList');
  var playArea = document.getElementById('playArea');
  var winArea = document.getElementById('winArea');
  var statusLine = document.getElementById('statusLine');

  function randomTarget(){
    return Math.floor(Math.random() * 100) + 1;
  }

  function proximityLabel(diff){
    if(diff <= 2) return 'Blazing hot';
    if(diff <= 5) return 'Hot';
    if(diff <= 10) return 'Warm';
    if(diff <= 20) return 'Cool';
    if(diff <= 40) return 'Cold';
    return 'Ice cold';
  }

  function pinPercentFromDiff(diff){
    var closeness = 1 - (diff / 99);
    if(closeness < 0) closeness = 0;
    if(closeness > 1) closeness = 1;
    return closeness * 100;
  }

  async function loadBest(){
    try{
      var res = await window.storage.get(STORAGE_KEY, false);
      best = res && res.value ? JSON.parse(res.value) : null;
    }catch(e){
      best = null;
    }
    renderBest();
  }

  async function saveBest(n){
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(n), false);
    }catch(e){ /* best score is a bonus feature; ignore storage failures */ }
  }

  function renderBest(){
    bestCountEl.textContent = best ? best : '–';
  }

  function noteInvalid(msg){
    inputNote.textContent = msg;
    inputNote.classList.add('show');
    guessInput.classList.remove('shake');
    void guessInput.offsetWidth;
    guessInput.classList.add('shake');
  }

  function clearInvalid(){
    inputNote.classList.remove('show');
  }

  function renderHistory(){
    if(history.length === 0){
      historyList.innerHTML = '<span class="empty-history">Your guesses will appear here.</span>';
      return;
    }
    historyList.innerHTML = '';
    history.forEach(function(h){
      var chip = document.createElement('span');
      chip.className = 'chip ' + (h.result === 'hit' ? 'hit' : (h.result === 'up' ? 'up' : 'down'));
      var arrow = h.result === 'hit' ? '&#10003;' : (h.result === 'up' ? '&#8593;' : '&#8595;');
      chip.innerHTML = '<span>' + arrow + '</span><span>' + h.value + '</span>';
      historyList.appendChild(chip);
    });
  }

  function submitGuess(){
    clearInvalid();
    var raw = guessInput.value.trim();

    if(raw === ''){
      noteInvalid('Enter a number first.');
      return;
    }
    var value = Number(raw);
    if(!Number.isInteger(value) || value < 1 || value > 100){
      noteInvalid('Guess must be a whole number between 1 and 100.');
      return;
    }
    if(history.some(function(h){ return h.value === value; })){
      noteInvalid('Already tried ' + value + ' — pick a new number.');
      return;
    }

    guesses += 1;
    guessCountEl.textContent = guesses;

    var diff = Math.abs(value - target);

    if(diff === 0){
      history.unshift({ value: value, result: 'hit' });
      renderHistory();
      won = true;
      handleWin();
      return;
    }

    var result = value > target ? 'up' : 'down';
    history.unshift({ value: value, result: result });
    renderHistory();

    var pct = pinPercentFromDiff(diff);
    meterPin.style.left = pct + '%';

    if(result === 'up'){
      hintLine.className = 'hint-line dir-up';
      hintLine.innerHTML = '<span class="arrow">&#8595;</span> Too high — tune lower';
    } else {
      hintLine.className = 'hint-line dir-down';
      hintLine.innerHTML = '<span class="arrow">&#8593;</span> Too low — tune higher';
    }
    hintSub.textContent = proximityLabel(diff) + ' · ' + diff + ' away';

    guessInput.value = '';
    guessInput.focus();
  }

  function handleWin(){
    var isNewBest = !best || guesses < best;
    if(isNewBest){
      best = guesses;
      saveBest(best);
      renderBest();
    }

    winArea.innerHTML =
      '<div class="win-wrap">' +
        '<div class="sonar-stage">' +
          '<div class="sonar-ring"></div>' +
          '<div class="sonar-ring r2"></div>' +
          '<div class="sonar-ring r3"></div>' +
          '<div class="sonar-core">' + target + '</div>' +
        '</div>' +
        '<h2>Signal locked.</h2>' +
        '<p>You found it in ' + guesses + (guesses === 1 ? ' guess.' : ' guesses.') + '</p>' +
        (isNewBest ? '<span class="best-badge">New best score</span>' : '') +
        '<div><button class="again-btn" id="againBtn">Hunt again</button></div>' +
      '</div>';

    playArea.style.display = 'none';
    winArea.style.display = 'block';
    statusLine.textContent = 'signal locked at ' + target;

    document.getElementById('againBtn').addEventListener('click', startNewGame);
  }

  function startNewGame(){
    target = randomTarget();
    guesses = 0;
    history = [];
    won = false;

    guessCountEl.textContent = '0';
    hintLine.className = 'hint-line dir-idle';
    hintLine.textContent = 'No guesses yet — take your first shot.';
    hintSub.textContent = '\u00a0';
    meterPin.style.left = '0%';
    renderHistory();
    clearInvalid();
    guessInput.value = '';

    winArea.style.display = 'none';
    winArea.innerHTML = '';
    playArea.style.display = 'block';
    statusLine.textContent = 'signal receiver ready';

    guessInput.focus();
  }

  guessBtn.addEventListener('click', submitGuess);
  guessInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter') submitGuess();
  });
  guessInput.addEventListener('input', clearInvalid);

  loadBest();
  startNewGame();
})();
</script>

</body>
</html>
